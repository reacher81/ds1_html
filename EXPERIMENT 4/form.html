<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>

<body>
    <fieldset>

        <form action="#" name="Ayush" target="_self" method="get">
            <label for="name">Username:</label>
            <input type="text" name="name" id="name" placeholder="Enter your name">
            <br>  <!-- for next line-->
            <br>  <!-- for one line space-->

            <label for="pass">Password:</label>
            <input type="password" name="pass" id="pass" placeholder="Enter password">
            <br>
            <br>
            <label for="email">Email</label>
            <input type="text" name="email" id="email" placeholder="Enter email id">
            <br><br>
            <label for="gender">Gender:</label>
            <input type="radio" name="gender" id="gender">
            <label for="radio">Male</label>
            <input type="radio" name="gender" id="gender">
            <label for="radio">Female</label>
            <br><br>



            <label for="hobb">Hobbies:</label>
            <input type="checkbox" name="hobb1" id="hobb1">
            <label for="hobb1">Cricket</label>
            <input type="checkbox" name="hobb1" id="hobb1">
            <label for="hobb1">Football</label>
            <br><br>

            <label for="dob">DOB:</label>
            <input type="date" name="dob" id="dob">
            <br><br>
            
            <label for="lang">Select Programming Language:</label> 
            <select name="lang" id="lang">

                
                <option value="C">C</option>
                <option value="C++">C++</option>
                <option value="Python">Python</option>
                <option value="Java">JAVA</option>
            </select>

            




        </form>

    </fieldset>

</body>

</html>
