<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>

<body>
    <fieldset>

        <form action="./response.html" name="Ayush" target="_self" method="get">
            <label for="name">Username:</label>
            <input type="text" name="name" id="name" placeholder="Enter your name" required>
            <br>  <!-- for next line-->
            <br>  <!-- for one line space-->

            <label for="pass">Password:</label>
            <input type="password" name="pass" id="pass" placeholder="Enter password">
            <br>
            <br>
            <label for="email">Email</label>
            <input type="text" name="email" id="email" placeholder="Enter email id">
            <br><br>
            <label for="gender">Gender:</label>
            <input type="radio" name="gender" id="gender">
            <label for="radio">Male</label>
            <input type="radio" name="gender" id="gender">
            <label for="radio">Female</label>
            <br><br>



            <label for="hobb">Hobbies:</label>
            <input type="checkbox" name="hobb1" id="hobb1">
            <label for="hobb1">Cricket</label>
            <input type="checkbox" name="hobb1" id="hobb1">
            <label for="hobb1">Football</label>
            <br><br>

            <label for="dob">DOB:</label>
            <input type="date" name="dob" id="dob">
            <br><br>
            
            <label for="lang">Select Programming Language:</label> 
            <select name="lang" id="lang">

                
                <option value="C">C</option>
                <option value="C++">C++</option>
                <option value="Python">Python</option>
                <option value="Java">JAVA</option>
            </select>
            <br><br>

            <label for="tel">Phone: </label>
            <input type="tel" name="tel" id="tel">
            <br><br>
            <label for="add">Adress</label>
            <textarea name="add" id="add"></textarea>
            <br><br>
            <label for="attmpt">Attempt: </label>
            <input type="number" name="attmpt" id="attmpt">
            <br><br>
            <label for="file">choose file:</label>
            <input type="file">
            <br><br>

            <label for="url">Homepage:</label>
            <input type="url" name="url" id="url">

            <label>only letter:</label>
            <input type="text" name="letters" pattern="[A-Za-z]+" required>

                <input type="submit" value="submit form">
                <input type="reset" value="reset form">

            




        </form>

    </fieldset>

</body>

</html>
